<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dòng tiền chứng khoán VN</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f0f0f0; }
        h1, h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #333; color: white; }
        .positive { color: green; font-weight: bold; }
        .negative { color: red; font-weight: bold; }
        #last-update { text-align: center; font-style: italic; color: #666; }
        #loading { text-align: center; font-size: 1.2em; color: #666; }
    </style>
</head>
<body>
    <h1>📊 Dòng tiền chứng khoán Việt Nam</h1>
    <p id="last-update"></p>
    <p id="loading">Đang tải dữ liệu…</p>

    <h2>🔥 Top 10 tiền vào (tăng giá + GTGD cao)</h2>
    <table id="top-in">
        <thead>
            <tr>
                <th>Mã</th>
                <th>Giá</th>
                <th>KL (lô)</th>
                <th>%</th>
                <th>GTGD (tỷ)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>💧 Top 10 tiền ra (giảm giá + GTGD cao)</h2>
    <table id="top-out">
        <thead>
            <tr>
                <th>Mã</th>
                <th>Giá</th>
                <th>KL (lô)</th>
                <th>%</th>
                <th>GTGD (tỷ)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json?' + new Date().getTime()); // tránh cache
                const data = await response.json();

                document.getElementById('last-update').textContent = 'Cập nhật lúc: ' + (data.last_update || 'Unknown');
                document.getElementById('loading').style.display = 'none';

                // Top tiền vào
                const tbodyIn = document.querySelector('#top-in tbody');
                tbodyIn.innerHTML = '';
                data.top_in.forEach(stock => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${stock.symbol}</strong></td>
                        <td>${stock.price.toLocaleString()}</td>
                        <td>${stock.volume.toLocaleString()}</td>
                        <td class="${stock.change_percent >= 0 ? 'positive' : 'negative'}">${stock.change_percent.toFixed(2)}%</td>
                        <td>${stock.value.toFixed(1)}</td>
                    `;
                    tbodyIn.appendChild(row);
                });

                // Top tiền ra
                const tbodyOut = document.querySelector('#top-out tbody');
                tbodyOut.innerHTML = '';
                data.top_out.forEach(stock => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${stock.symbol}</strong></td>
                        <td>${stock.price.toLocaleString()}</td>
                        <td>${stock.volume.toLocaleString()}</td>
                        <td class="${stock.change_percent >= 0 ? 'positive' : 'negative'}">${stock.change_percent.toFixed(2)}%</td>
                        <td>${stock.value.toFixed(1)}</td>
                    `;
                    tbodyOut.appendChild(row);
                });

            } catch (error) {
                document.getElementById('loading').textContent = 'Lỗi tải dữ liệu: ' + error.message;
            }
        }

        loadData();
        // Tự reload mỗi 5 phút
        setInterval(loadData, 300000);
    </script>
</body>
</html>
